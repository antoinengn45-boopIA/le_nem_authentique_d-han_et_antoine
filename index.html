<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Nem Authentique - Commande</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="lock-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-bold mb-4">Accès Privé</h1>
            <input type="password" id="entry-pass" class="w-full p-3 border rounded-lg mb-4" placeholder="Code d'accès">
            <button onclick="checkEntry()" class="w-full bg-black text-white py-3 rounded-lg font-bold hover:bg-gray-800 transition">Entrer</button>
        </div>
    </div>

    <div id="main-interface" class="hidden">
        <header class="p-6 border-b bg-white flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button id="admin-btn" onclick="toggleAdmin()" class="hidden text-xs bg-blue-600 text-white px-3 py-1 rounded font-bold hover:bg-blue-700 transition">Panel Admin</button>
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-black rounded-full flex items-center justify-center text-white font-bold text-[10px]">NEM</div>
                    <h1 class="text-xl font-bold">Le Nem Authentique</h1>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="showProfile()" class="text-sm font-bold underline">Mon Profil</button>
                <button onclick="logout()" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded">Déconnexion</button>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-6 py-12">
            <div id="profile-panel" class="hidden bg-white p-6 rounded-2xl border mb-8 shadow-sm">
                <h2 class="text-xl font-bold mb-4">Modifier mon profil</h2>
                <input type="text" id="edit-name" class="w-full p-2 border mb-2 rounded" placeholder="Nom Prénom">
                <input type="email" id="edit-email" class="w-full p-2 border mb-2 rounded" placeholder="Email">
                <input type="tel" id="edit-phone" class="w-full p-2 border mb-4 rounded" placeholder="Téléphone">
                <button onclick="saveProfile()" class="bg-black text-white px-4 py-2 rounded">Enregistrer</button>
            </div>

            <div id="admin-panel" class="hidden bg-blue-50 p-6 rounded-2xl border mb-8">
                <h2 class="font-bold text-blue-800 mb-4">Ajouter un produit</h2>
                <div class="flex gap-2">
                    <input type="text" id="new-item" placeholder="Nom du produit" class="p-2 border rounded flex-1">
                    <input type="number" id="new-price" placeholder="Prix (€)" class="p-2 border rounded w-24">
                    <button onclick="addItem()" class="bg-blue-600 text-white px-4 py-2 rounded">Ajouter</button>
                </div>
            </div>

            <h2 class="text-2xl font-bold mb-6">Nos Spécialités</h2>
            <div id="menu-container" class="grid md:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <script>
        let catalog = JSON.parse(localStorage.getItem('catalog')) || [
            {name: 'Nem Porc Artisanal', price: 1.50},
            {name: 'Nem Poulet', price: 1.50},
            {name: 'Samoussa Bœuf', price: 1.20},
            {name: 'Samoussa Légumes', price: 1.20}
        ];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = catalog.map(item => `
                <div class="bg-white p-6 rounded-2xl border flex flex-col justify-between">
                    <h3 class="font-bold text-lg">${item.name}</h3>
                    <p class="text-2xl font-bold mt-4">${item.price.toFixed(2)} €</p>
                </div>
            `).join('');
        }

        function addItem() {
            const name = document.getElementById('new-item').value;
            const price = parseFloat(document.getElementById('new-price').value);
            if(name && price) {
                catalog.push({name, price});
                localStorage.setItem('catalog', JSON.stringify(catalog));
                renderMenu();
            }
        }

        // --- Logique d'accès (Inchangée) ---
        function checkEntry() {
            if (document.getElementById('entry-pass').value === "nem.vietnam") {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('main-interface').classList.remove('hidden');
                renderMenu();
                // (Suite de la logique d'inscription...)
                if(!localStorage.getItem('user_account')) {
                    const name = prompt("Nom et Prénom :");
                    const email = prompt("Email :");
                    const phone = prompt("Numéro de téléphone :");
                    localStorage.setItem('user_account', JSON.stringify({name, email, phone}));
                }
                updateUI();
            } else { alert("Code incorrect !"); }
        }

        function updateUI() {
            const user = JSON.parse(localStorage.getItem('user_account'));
            if(user.email === "admin@admin-nem.com") document.getElementById('admin-btn').classList.remove('hidden');
        }

        function toggleAdmin() { document.getElementById('admin-panel').classList.toggle('hidden'); }
        function showProfile() { document.getElementById('profile-panel').classList.toggle('hidden'); }
        function logout() { localStorage.removeItem('user_account'); location.reload(); }
        function saveProfile() { alert("Profil enregistré !"); }
    </script>
</body>
</html>
