<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Nem Authentique - Espace Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">(function(){ emailjs.init("x-PY3Cs4sSaLBcVj5"); })();</script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="lock-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-bold mb-4">Accès Privé</h1>
            <input type="password" id="entry-pass" class="w-full p-3 border rounded-lg mb-4" placeholder="Code d'accès">
            <button onclick="checkEntry()" class="w-full bg-black text-white py-3 rounded-lg font-bold">Entrer</button>
        </div>
    </div>

    <div id="main-interface" class="hidden">
        <header class="p-6 border-b bg-white flex justify-between items-center sticky top-0 z-40">
            <h1 class="text-xl font-bold">Le Nem Authentique</h1>
            <div class="flex items-center gap-4">
                <button onclick="showProfile()" class="text-sm font-bold underline">Mon Profil</button>
                <button onclick="logout()" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded">Déconnexion</button>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-6 py-12">
            <div id="profile-panel" class="hidden bg-white p-6 rounded-2xl border mb-8 shadow-sm">
                <h2 class="text-xl font-bold mb-4">Mes Informations</h2>
                <div id="profile-details" class="text-gray-700 space-y-2"></div>
            </div>

            <div id="admin-panel" class="hidden bg-blue-50 p-6 rounded-2xl border mb-8">
                <h2 class="font-bold text-blue-800 mb-4">Admin : Liste des membres</h2>
                <div id="user-list" class="text-sm"></div>
            </div>

            <div id="menu-container" class="grid md:grid-cols-2 gap-6"></div>
        </main>
    </div>

    <script>
        // --- Sessions & Profils ---
        function logout() { localStorage.removeItem('user_account'); location.reload(); }
        
        function checkEntry() {
            if (document.getElementById('entry-pass').value === "nem.vietnam") {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('main-interface').classList.remove('hidden');
                
                if(!localStorage.getItem('user_account')) {
                    const name = prompt("Nom et Prénom :");
                    const email = prompt("Email :");
                    const phone = prompt("Numéro de téléphone :");
                    const newUser = { name, email, phone };
                    localStorage.setItem('user_account', JSON.stringify(newUser));
                    
                    // Stocker liste pour admin
                    let users = JSON.parse(localStorage.getItem('all_users') || '[]');
                    users.push(newUser);
                    localStorage.setItem('all_users', JSON.stringify(users));
                }
                updateUI();
            } else { alert("Code incorrect !"); }
        }

        function showProfile() {
            const user = JSON.parse(localStorage.getItem('user_account'));
            document.getElementById('profile-details').innerHTML = `
                <p><strong>Nom :</strong> ${user.name}</p>
                <p><strong>Email :</strong> ${user.email}</p>
                <p><strong>Téléphone :</strong> ${user.phone}</p>`;
            document.getElementById('profile-panel').classList.toggle('hidden');
        }

        function updateUI() {
            const user = JSON.parse(localStorage.getItem('user_account'));
            if(user.email === "admin@admin.com") {
                document.getElementById('admin-panel').classList.remove('hidden');
                const users = JSON.parse(localStorage.getItem('all_users') || '[]');
                document.getElementById('user-list').innerHTML = users.map(u => 
                    `<p>${u.name} - ${u.email} - ${u.phone}</p>`).join('');
            }
        }

        // --- Catalogue ---
        let catalog = JSON.parse(localStorage.getItem('catalog')) || [{name: 'Nem Porc', price: 1.50}];
        const container = document.getElementById('menu-container');
        catalog.forEach(item => {
            container.innerHTML += `
                <div class="bg-white p-4 rounded-lg border flex justify-between">
                    <h3 class="font-bold">${item.name}</h3>
                    <span>${item.price}€</span>
                </div>`;
        });
    </script>
</body>
</html>
