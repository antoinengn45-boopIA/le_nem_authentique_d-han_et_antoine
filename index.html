<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Nem Authentique - Accès</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div id="login-screen" class="bg-white p-8 rounded-2xl shadow-xl w-96 text-center">
        <h1 class="text-2xl font-bold mb-4">Accès Privé</h1>
        <p class="text-sm text-gray-500 mb-6">Indice : Produit vendu. Pays d'origine</p>
        <input type="password" id="entry-pass" class="w-full p-3 border rounded-lg mb-4" placeholder="Code d'accès">
        <button onclick="checkEntry()" class="w-full bg-black text-white py-3 rounded-lg font-bold">Entrer</button>
    </div>

    <div id="signup-screen" class="hidden bg-white p-8 rounded-2xl shadow-xl w-96">
        <h2 class="text-xl font-bold mb-6">Créer mon compte</h2>
        <input type="email" id="user-email" class="w-full p-3 border rounded-lg mb-3" placeholder="Adresse e-mail">
        <input type="tel" id="user-phone" class="w-full p-3 border rounded-lg mb-3" placeholder="Numéro de téléphone">
        <input type="password" id="user-pass" class="w-full p-3 border rounded-lg mb-6" placeholder="Mot de passe">
        <button onclick="createAccount()" class="w-full bg-orange-600 text-white py-3 rounded-lg font-bold">S'inscrire</button>
    </div>

    <script>
        // 1. Vérification du mot de passe d'entrée
        function checkEntry() {
            const pass = document.getElementById('entry-pass').value;
            if (pass === "nem.vietnam") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('signup-screen').classList.remove('hidden');
            } else {
                alert("Code incorrect !");
            }
        }

        // 2. Création de compte (Stockage local simple)
        function createAccount() {
            const email = document.getElementById('user-email').value;
            const phone = document.getElementById('user-phone').value;
            const pass = document.getElementById('user-pass').value;

            if(email && phone && pass) {
                const user = { email, phone, pass };
                localStorage.setItem('user_account', JSON.stringify(user));
                alert("Compte créé avec succès !");
                window.location.href = "index_principal.html"; // Redirection vers votre site
            } else {
                alert("Veuillez remplir tous les champs.");
            }
        }
    </script>
</body>
</html>
