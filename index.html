<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hanetantoine - Foodtech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://tally.so/widgets/embed.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tighter">hanetantoine</h1>
            <button 
                data-tally-open="EkML7o" 
                data-tally-emoji-text="👋" 
                data-tally-emoji-animation="wave"
                class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-full font-medium transition-all shadow-md"
            >
                Contact & Suggestions
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <section class="mb-12">
            <h2 class="text-3xl font-bold mb-8">Menu du jour</h2>
            <div id="menu-container" class="grid md:grid-cols-3 gap-6">
                </div>
        </section>
    </main>

    <script>
        const menu = [
            { name: 'Burger Signature', price: 12.50 },
            { name: 'Salade César', price: 9.00 },
            { name: 'Pizza Margherita', price: 11.00 }
        ];

        const container = document.getElementById('menu-container');

        menu.forEach(item => {
            const card = document.createElement('div');
            // Design des cartes (Card style)
            card.className = "bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-300";
            card.innerHTML = `
                <div class="flex flex-col h-full justify-between">
                    <div>
                        <h3 class="text-xl font-bold mb-2">${item.name}</h3>
                        <p class="text-blue-600 font-bold text-lg">${item.price.toFixed(2)} €</p>
                    </div>
                    <button onclick="alert('Ajouté : ${item.name}')" 
                            class="mt-6 w-full bg-slate-900 text-white py-2.5 rounded-xl font-semibold hover:bg-slate-700 transition">
                        Ajouter
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
