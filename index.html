<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Nem Authentique - Espace Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="lock-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-bold mb-4">Accès Privé</h1>
            <input type="password" id="entry-pass" class="w-full p-3 border rounded-lg mb-4" placeholder="Code d'accès">
            <button onclick="checkEntry()" class="w-full bg-black text-white py-3 rounded-lg font-bold hover:bg-gray-800 transition">Entrer</button>
        </div>
    </div>

    <div id="main-interface" class="hidden">
        <header class="p-6 border-b bg-white flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button id="admin-btn" onclick="toggleAdmin()" class="hidden text-xs bg-blue-600 text-white px-3 py-1 rounded font-bold hover:bg-blue-700 transition">Panel Admin</button>
                <h1 class="text-xl font-bold">Le Nem Authentique</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="showProfile()" class="text-sm font-bold underline hover:text-gray-600">Mon Profil</button>
                <button onclick="logout()" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded hover:bg-red-200 transition">Déconnexion</button>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-6 py-12">
            <div id="profile-panel" class="hidden bg-white p-6 rounded-2xl border mb-8 shadow-sm">
                <h2 class="text-xl font-bold mb-4">Modifier mon profil</h2>
                <input type="text" id="edit-name" class="w-full p-2 border mb-2 rounded" placeholder="Nom Prénom">
                <input type="email" id="edit-email" class="w-full p-2 border mb-2 rounded" placeholder="Email">
                <input type="tel" id="edit-phone" class="w-full p-2 border mb-4 rounded" placeholder="Téléphone">
                <div class="flex flex-wrap gap-2">
                    <button onclick="saveProfile()" class="bg-black text-white px-4 py-2 rounded hover:bg-gray-800">Enregistrer</button>
                    <button onclick="downloadProfile()" class="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300">Enregistrer sur mon PC (.txt)</button>
                </div>
            </div>

            <div id="admin-panel" class="hidden bg-blue-50 p-6 rounded-2xl border mb-8">
                <h2 class="font-bold text-blue-800 mb-4">Membres inscrits</h2>
                <div id="user-list" class="text-sm space-y-2"></div>
            </div>
        </main>
    </div>

    <script>
        // --- Logique d'accès ---
        function checkEntry() {
            if (document.getElementById('entry-pass').value === "nem.vietnam") {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('main-interface').classList.remove('hidden');
                
                if(!localStorage.getItem('user_account')) {
                    const name = prompt("Nom et Prénom :");
                    const email = prompt("Email :");
                    const phone = prompt("Numéro de téléphone :");
                    const newUser = { name, email, phone };
                    localStorage.setItem('user_account', JSON.stringify(newUser));
                    
                    let users = JSON.parse(localStorage.getItem('all_users') || '[]');
                    users.push(newUser);
                    localStorage.setItem('all_users', JSON.stringify(users));
                }
                updateUI();
            } else { alert("Code incorrect !"); }
        }

        // --- Fonctions Profil ---
        function showProfile() { 
            const u = JSON.parse(localStorage.getItem('user_account'));
            document.getElementById('edit-name').value = u.name;
            document.getElementById('edit-email').value = u.email;
            document.getElementById('edit-phone').value = u.phone;
            document.getElementById('profile-panel').classList.toggle('hidden');
        }

        function saveProfile() {
            const updated = { 
                name: document.getElementById('edit-name').value, 
                email: document.getElementById('edit-email').value, 
                phone: document.getElementById('edit-phone').value 
            };
            localStorage.setItem('user_account', JSON.stringify(updated));
            alert("Profil mis à jour !");
        }

        function downloadProfile() {
            const u = JSON.parse(localStorage.getItem('user_account'));
            const blob = new Blob([`Nom: ${u.name}\nEmail: ${u.email}\nTel: ${u.phone}`], {type: "text/plain"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "mon_profil.txt";
            a.click();
        }

        // --- Fonctions Admin & Session ---
        function toggleAdmin() { document.getElementById('admin-panel').classList.toggle('hidden'); }
        
        function updateUI() {
            const user = JSON.parse(localStorage.getItem('user_account'));
            if(user.email === "admin@admin-nem.com") {
                document.getElementById('admin-btn').classList.remove('hidden');
                const users = JSON.parse(localStorage.getItem('all_users') || '[]');
                document.getElementById('user-list').innerHTML = users.map(u => 
                    `<div class="border-b py-2 flex justify-between"><span>${u.name}</span> <span class="text-gray-500">${u.email}</span></div>`).join('');
            }
        }
        
        function logout() { localStorage.removeItem('user_account'); location.reload(); }
    </script>
</body>

        </main>
